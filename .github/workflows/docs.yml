name: Docs

# Publishes the documentation to GitHub Pages at oss.nekolab.studio/trill.
# Every push to main refreshes the Edge docs. A finished release adds or
# refreshes that minor series' versioned docs, built from its tag; running
# after the Release workflow (rather than on the tag) keeps the deploy on
# main, which the github-pages environment allows.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the build can find release tags for versioned docs.
          fetch-depth: 0

      - name: Build site
        run: |
          python3 docs-site/build.py --output dist/docs-site
          # The setup command downloads this.
          test -s dist/docs-site/setup.sh

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs-site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
